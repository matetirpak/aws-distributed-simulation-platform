[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds the workspace, so a game built with 1.98.1 can use these crates. CI checks it.
rust-version = "1.98"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
controller = { path = "crates/controller" }
games = { path = "crates/games" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
rand_chacha = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# The controller catches panics in game logic and turns them into invalid actions or a
# voided match, which only works with unwinding.
panic = "unwind"
