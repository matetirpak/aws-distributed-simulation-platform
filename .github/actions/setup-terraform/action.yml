name: Set up Terraform
description: >
  Install exactly the Terraform version in /.terraform-version, without the
  wrapper (so exit codes and stdout are Terraform's own). Requires a checkout.

runs:
  using: composite
  steps:
    - name: Read .terraform-version
      id: version
      shell: bash
      run: |
        version=$(tr -d '[:space:]' <"$GITHUB_WORKSPACE/.terraform-version")
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=.terraform-version::expected an exact version such as 1.16.4"
          exit 1
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"

    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false
